# Full insta-bot stack: the app + its dependency (MinIO).
#
#   1.  cp .env.example .env   and fill in MINIO_USER / MINIO_PASSWORD (+ IG creds)
#   2.  docker compose up -d --build
#   3.  open http://localhost:4000
#
# Compose reads MINIO_USER / MINIO_PASSWORD from .env, so the same credentials
# seed the MinIO server AND the app — set them in one place.
services:
  app:
    build: .
    container_name: insta-bot
    ports:
      - "${PORT:-4000}:4000"
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      ENV: production
      # Reach the sibling service by its compose DNS name, not localhost.
      MINIO_URL: minio:9000
      MINIO_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-insta-bot-usernames}
      # No display in a container: headless, bundled Chromium.
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_CHANNEL: chromium
      PLAYWRIGHT_CLEAN_LAUNCH: "true"
      IG_USERNAME: ${IG_USERNAME:-}
      IG_PASSWORD: ${IG_PASSWORD:-}
    volumes:
      - app_data:/app/backend/data     # store.json, screenshots, chrome-profile
    depends_on:
      - minio
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  minio_data:
  app_data:
